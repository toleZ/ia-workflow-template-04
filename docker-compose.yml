version: '3.8'

services:
  analytics-db:
    image: postgres:16-alpine
    container_name: analytics-db
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=agent_user
      - POSTGRES_PASSWORD=agent_password
      - POSTGRES_DB=analytics_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./backend/alembic/analytics_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d analytics_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
